<!-- meta tool="1" title="Markdown table generator | NoByte" description="Build a Markdown table in a grid editor with column alignment, and copy the GitHub-flavored output. Runs in your browser." path="/tools/markdown-table/" keywords="markdown table, table generator, gfm table, markdown generator" -->
{{tool-hero:markdown-table}}
<section class="section--tight">
  <div class="container">
    <div class="row row-wrap items-end mb-4">
      <div class="field"><label for="mt-rows">Rows</label><input class="input mono" id="mt-rows" type="number" min="1" max="20" value="3" style="width:90px;" /></div>
      <div class="field"><label for="mt-cols">Columns</label><input class="input mono" id="mt-cols" type="number" min="1" max="10" value="3" style="width:90px;" /></div>
      <button class="btn btn--ghost" id="mt-clear">Clear cells</button>
    </div>
    <div class="table-scroll"><table class="data-table" id="mt-grid"></table></div>
    <div class="result-panel mt-5">
      <div class="row between mb-3">
        <span class="label">Markdown</span>
        <button class="btn copy-btn" data-copy="#mt-out"><svg class="icon icon-copy" aria-hidden="true"><use href="/assets/icons.svg#copy"></use></svg><svg class="icon icon-check" aria-hidden="true"><use href="/assets/icons.svg#check"></use></svg> Copy</button>
      </div>
      <textarea class="textarea mono" id="mt-out" readonly style="min-height:240px;" aria-label="Markdown output"></textarea>
    </div>

    <div class="notice notice--info mt-5">
      <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#info"></use></svg>
      <div>Set the rows and columns, type into the grid, and choose each column's alignment. The GitHub-flavored Markdown updates live below, ready to paste into a README or any Markdown file. Everything stays in your browser.</div>
    </div>
  </div>
</section>
<script type="module" src="/js/tools/markdown-table.js"></script>
