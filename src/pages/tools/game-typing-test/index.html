<!-- meta tool="1" title="Typing speed test | NoByte" description="Measure your typing speed in words per minute and your accuracy. Type the passage before the timer runs out. Runs in your browser." path="/tools/game-typing-test/" keywords="typing speed test, typing test, words per minute, wpm test, typing practice" -->
{{tool-hero:game-typing-test}}
<section class="section--tight">
  <div class="container">
    <div class="game" style="max-width:min(96vw, 780px);">
      <div class="hud">
        <div class="score-row">
          <div class="score-box"><span class="score-box__label">WPM</span><span class="score-box__val" id="ty-wpm">0</span></div>
          <div class="score-box"><span class="score-box__label">Acc</span><span class="score-box__val" id="ty-acc">100%</span></div>
          <div class="score-box"><span class="score-box__label">Time</span><span class="score-box__val" id="ty-time">30</span></div>
        </div>
        <div class="row" style="gap:var(--s2);">
          <select class="select select--sm" id="ty-dur" aria-label="Test length">
            <option value="15">15s</option>
            <option value="30" selected>30s</option>
            <option value="60">60s</option>
          </select>
          <button class="btn btn--primary btn--sm" id="ty-new" type="button">Restart</button>
        </div>
      </div>
      <div class="type-text game-board" id="ty-text" tabindex="0" role="textbox" aria-label="Typing passage"></div>
      <textarea class="sr-only" id="ty-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type here"></textarea>
      <p class="game-status" id="ty-status">Tap the passage and start typing.</p>
      <h2 class="g-how">How to play</h2>
      <p class="g-note">The timer starts on your first keystroke. Correct letters darken, mistakes turn red. Pick a length with the dropdown.</p>
    </div>
  </div>
</section>
<style>
  .type-text { font-family: var(--font-mono); font-size: clamp(1.1rem, 2.6vw, 1.6rem); line-height: 2; letter-spacing: .3px; cursor: text; user-select: none; min-height: 40vh; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; }
  .type-text span { color: var(--ink-3); }
  .type-text span.ok { color: var(--ink); }
  .type-text span.bad { color: #fff; background: var(--bad); border-radius: 3px; }
  .type-text span.cur { box-shadow: inset 0 -3px 0 var(--accent); }
  .type-text.done { opacity: .7; }
  /* On a phone the on-screen keyboard takes roughly the bottom third, so a
     40vh passage would sit mostly behind it. */
  @media (max-width: 640px) {
    .type-text { min-height: 24vh; line-height: 1.75; font-size: 1rem; }
  }
</style>
<script type="module" src="/js/tools/game-typing-test.js"></script>
