<!-- meta tool="1" title="Snake: the classic arcade game | NoByte" description="Play Snake in your browser. Steer with arrow keys or swipe, eat to grow, and avoid hitting the walls or yourself. Your best score stays on your device." path="/tools/game-snake/" keywords="snake game, classic snake, arcade game, browser game, play snake" -->
{{tool-hero:game-snake}}
<section class="section--tight">
  <div class="container">
    <div class="game game-fit" style="--gmax:620px;">
      <div class="hud">
        <div class="score-row">
          <div class="score-box"><span class="score-box__label">Score</span><span class="score-box__val" id="s-score">0</span></div>
          <div class="score-box"><span class="score-box__label">Time</span><span class="score-box__val" id="s-time">–</span></div>
          <div class="score-box"><span class="score-box__label">Best</span><span class="score-box__val" id="s-best">0</span></div>
        </div>
        <div class="row" style="gap:var(--s2);">
          <button class="btn" id="s-pause" type="button" disabled>Pause</button>
          <button class="btn btn--primary" id="s-new" type="button">New game</button>
        </div>
      </div>
      <div class="game-board game-board--swipe" id="s-wrap"><canvas id="s-canvas" aria-label="Snake game board"></canvas></div>
      <p class="game-status" id="s-status"></p>
      <h2 class="g-how">How to play</h2>
      <p class="g-note">Steer with <kbd class="cap">←</kbd><kbd class="cap">↑</kbd><kbd class="cap">→</kbd><kbd class="cap">↓</kbd> or swipe, <kbd class="cap">Space</kbd> to pause. Slide off one edge and you reappear on the other. Reach each piece of food before its <b>Time</b> runs out, or the game ends. You also crash if you hit yourself. Speeds up as you grow.</p>
    </div>
  </div>
</section>
<style>
  #s-wrap { padding: var(--s3); }
  #s-canvas { display: block; width: 100%; height: auto; border-radius: var(--radius); }
  #s-time.low { color: var(--bad); }
</style>
<script type="module" src="/js/tools/game-snake.js"></script>
