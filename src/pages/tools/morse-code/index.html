<!-- meta tool="1" title="Morse code translator | NoByte" description="Translate text to International Morse code and back. Covers letters, digits, and common punctuation. Runs in your browser." path="/tools/morse-code/" keywords="morse code translator, morse code, text to morse, morse to text, morse decoder" -->
{{tool-hero:morse-code}}
<section class="section--tight">
  <div class="container">
    <div class="row row-wrap mb-3" style="gap:var(--s4);align-items:center;">
      <div class="tabs" data-tabs role="tablist" aria-label="Direction">
        <button class="tab" role="tab" id="mc-t-enc" aria-controls="mc-p-enc" aria-selected="true">Text to Morse</button>
        <button class="tab" role="tab" id="mc-t-dec" aria-controls="mc-p-dec" aria-selected="false" tabindex="-1">Morse to text</button>
      </div>
    </div>
    <div class="tab-panel" id="mc-p-enc" role="tabpanel" aria-labelledby="mc-t-enc"></div>
    <div class="tab-panel" id="mc-p-dec" role="tabpanel" aria-labelledby="mc-t-dec" hidden></div>

    <div class="tool-layout tool-layout--split">
      <div class="field">
        <label for="mc-input">Input</label>
        <textarea class="textarea" id="mc-input" spellcheck="false" placeholder="SOS" style="min-height:200px;"></textarea>
      </div>
      <div class="field">
        <div class="row between"><label for="mc-output">Output</label>
          <button class="btn btn--sm copy-btn" data-copy="#mc-output"><svg class="icon icon-copy" aria-hidden="true"><use href="/assets/icons.svg#copy"></use></svg><svg class="icon icon-check" aria-hidden="true"><use href="/assets/icons.svg#check"></use></svg> Copy</button>
        </div>
        <textarea class="textarea mono" id="mc-output" readonly spellcheck="false" style="min-height:200px;"></textarea>
        <p class="field-error" id="mc-error"></p>
      </div>
    </div>

    <div class="notice notice--info mt-4">
      <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#info"></use></svg>
      <div>Uses International Morse. Letters are separated by a space and words by a slash ( / ). Characters with no Morse equivalent are skipped when encoding.</div>
    </div>
  </div>
</section>
<script type="module" src="/js/tools/morse-code.js"></script>
