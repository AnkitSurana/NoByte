<!-- meta tool="1" title="Timestamp converter: Unix time to date | NoByte" description="Convert Unix timestamps (seconds or milliseconds) to and from human-readable dates, in any timezone. Runs in your browser." path="/tools/timestamp-converter/" keywords="timestamp converter, unix time, epoch converter, epoch to date" -->
{{tool-hero:timestamp-converter}}
<section class="section--tight">
  <div class="container" style="max-width:760px;">
    <div class="result-panel text-center mb-5">
      <div class="muted small">Current Unix time</div>
      <div class="result-value" id="ts-now">—</div>
      <button class="btn btn--sm copy-btn mt-2" data-copy="#ts-now-val"><svg class="icon icon-copy" aria-hidden="true"><use href="/assets/icons.svg#copy"></use></svg><svg class="icon icon-check" aria-hidden="true"><use href="/assets/icons.svg#check"></use></svg> Copy</button>
      <input type="hidden" id="ts-now-val" />
    </div>

    <div class="card mb-4">
      <div class="field mb-3">
        <label for="ts-epoch">Unix timestamp</label>
        <input class="input mono" id="ts-epoch" inputmode="numeric" placeholder="1716239022" />
        <p class="hint" id="ts-unit-hint">Seconds and milliseconds are detected automatically.</p>
      </div>
      <div class="field">
        <label for="ts-tz">Timezone</label>
        <select class="select" id="ts-tz"></select>
      </div>
      <div class="stack mt-4">
        <div class="result-row"><span class="label">Local</span><span class="val" id="ts-local">—</span></div>
        <div class="result-row"><span class="label">UTC</span><span class="val" id="ts-utc">—</span></div>
        <div class="result-row"><span class="label">ISO 8601</span><span class="val mono" id="ts-iso">—</span></div>
        <div class="result-row"><span class="label">Relative</span><span class="val" id="ts-rel">—</span></div>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label for="ts-date">Date and time</label>
        <input class="input mono" id="ts-date" type="datetime-local" />
      </div>
      <div class="stack mt-4">
        <div class="result-row"><span class="label">Seconds</span><span class="val mono" id="ts-out-s">—</span></div>
        <div class="result-row"><span class="label">Milliseconds</span><span class="val mono" id="ts-out-ms">—</span></div>
      </div>
    </div>
  </div>
</section>
<script type="module" src="/js/tools/timestamp-converter.js"></script>
