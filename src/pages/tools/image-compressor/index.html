<!-- meta tool="1" title="Image compressor: shrink JPG and WebP | NoByte" description="Compress JPG and WebP images in your browser with a quality slider and before/after sizes. Images are never uploaded." path="/tools/image-compressor/" keywords="image compressor, compress image, reduce image size, jpeg compressor" -->
{{tool-hero:image-compressor}}
<section class="section--tight">
  <div class="container" style="max-width:820px;">
    <div class="dropzone" id="ic-drop">
      <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#image"></use></svg>
      <div><strong>Drop an image here</strong> or click to choose</div>
      <div class="xs">JPG, PNG, or WebP</div>
    </div>
    <div class="row row-wrap mt-4" style="gap:var(--s4);align-items:end;">
      <div class="field grow" style="min-width:220px;">
        <div class="row between"><label for="ic-quality">Quality</label><span class="mono" id="ic-quality-val">70%</span></div>
        <input type="range" id="ic-quality" min="10" max="100" value="70" />
      </div>
      <div class="field"><label for="ic-format">Output</label>
        <select class="select" id="ic-format"><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select>
      </div>
    </div>
    <div class="img-compare mt-4 hidden" id="ic-compare">
      <div><div class="label mb-2">Original <span class="mono muted xs" id="ic-before">—</span></div><img class="img-preview" id="ic-img-before" alt="Original image" /></div>
      <div><div class="label mb-2">Compressed <span class="mono muted xs" id="ic-after">—</span></div><img class="img-preview" id="ic-img-after" alt="Compressed image" /></div>
    </div>
    <div class="row mt-4" style="gap:var(--s3);">
      <button class="btn btn--primary" id="ic-download" disabled><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#download"></use></svg> Download</button>
      <span class="badge badge--ok hidden" id="ic-saved"></span>
    </div>
  </div>
</section>
<script type="module" src="/js/tools/image-compressor.js"></script>
