<header class="site-header">
  <div class="container container-wide site-header__inner">
    <a class="brand" href="/" aria-label="NoByte home">
      <span class="brand__word" role="img" aria-label="NoByte"></span>
    </a>

    <form class="hsearch" role="search" action="/tools/" method="get">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/icons.svg#search"></use></svg>
      <input type="search" name="q" placeholder="Search tools" aria-label="Search tools" autocomplete="off" />
    </form>

    <nav class="nav" id="nav" aria-label="Primary">
      <!-- The header search is hidden on phones, so the drawer carries its own
           copy. Both are plain GET forms, so neither needs JS. -->
      <form class="nav__search" role="search" action="/tools/" method="get">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/icons.svg#search"></use></svg>
        <input type="search" name="q" placeholder="Search tools" aria-label="Search tools" autocomplete="off" />
      </form>
      <a href="/tools/">Tools</a>
      <a href="/blog/">Blog</a>
      <a href="/suggest/">Suggest</a>
      <a href="/about/">About</a>
      <a class="nav__gh" href="https://github.com/AnkitSurana/NoByte" rel="noopener" aria-label="Star NoByte on GitHub" title="Star on GitHub">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/icons.svg#github"></use></svg>
        <span>Star</span>
      </a>
    </nav>

    <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Toggle colour theme">
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>

    <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
</header>
